# Publishes the static sample-data demo to GitHub Pages:
#   https://crypto-data-api.github.io/crypto-whale-dashboard/
#
# GitHub Pages has no server and CryptoDataApi sends no CORS headers, so this
# build only shows the bundled snapshots in public/sample. Live data needs the
# Next.js server (npm run dev / Vercel) with CDA_API_KEY set.
#
# One-time setup: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Deploy sample demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static sample site
        run: npm run build:static
        env:
          NEXT_PUBLIC_STATIC_SAMPLE: "1"
          NEXT_PUBLIC_BASE_PATH: /crypto-whale-dashboard
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Disable Jekyll
        run: touch out/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
